services:
  - type: web
    name: membersense
    runtime: python
    repo: https://github.com/JulianSMatthews/membersense
    branch: main
    plan: starter
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn membersense.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: "production"
      - key: MEMBERSENSE_GYM_NAME
        value: "Anytime Fitness High Wycombe"
      - key: MEMBERSENSE_DATABASE_URL
        fromDatabase:
          name: membersense-db
          property: connectionString
      - key: MEMBERSENSE_DEFAULT_COUNTRY_CODE
        value: "44"
      - key: MEMBERSENSE_SESSION_SECRET
        generateValue: true
      - key: MEMBERSENSE_SESSION_COOKIE_SECURE
        value: "1"
      - key: MEMBERSENSE_ADMIN_TOKEN
        generateValue: true
      - key: MEMBERSENSE_BOOTSTRAP_STAFF_USERNAME
        value: "jsm"
      - key: MEMBERSENSE_BOOTSTRAP_STAFF_NAME
        value: "JSM"
      - key: MEMBERSENSE_BOOTSTRAP_STAFF_EMAIL
        value: "jsm@membersense.local"
      - key: MEMBERSENSE_BOOTSTRAP_STAFF_PASSWORD
        sync: false
      - key: MEMBERSENSE_DRY_RUN
        value: "1"
      - key: MEMBERSENSE_NGROK
        value: "0"
      - key: MEMBERSENSE_MEDIA_DIR
        value: "/var/data/membersense-media"
      - key: USE_AZURE_AVATAR
        value: "1"
      - key: AZURE_AVATAR_KEY
        sync: false
      - key: AZURE_AVATAR_REGION
        sync: false
      - key: AZURE_AVATAR_ENDPOINT
        sync: false
      - key: AZURE_AVATAR_CHARACTER
        sync: false
      - key: AZURE_AVATAR_STYLE
        sync: false
      - key: AZURE_AVATAR_VOICE
        sync: false
      - key: MEMBERSENSE_TWILIO_ACCOUNT_SID
        sync: false
      - key: MEMBERSENSE_TWILIO_AUTH_TOKEN
        sync: false
      - key: MEMBERSENSE_TWILIO_FROM
        sync: false
      - key: MEMBERSENSE_TWILIO_MESSAGING_SERVICE_SID
        sync: false
    disk:
      name: membersense-media
      mountPath: /var/data/membersense-media
      sizeGB: 5

  - type: cron
    name: membersense-clubwise
    repo: https://github.com/JulianSMatthews/membersense
    branch: main
    runtime: docker
    region: oregon
    plan: 1c-2g
    dockerfilePath: ./Dockerfile.clubwise
    # Check manual requests every five minutes; one daily import at 06:00 London.
    schedule: "*/5 * * * *"
    envVars:
      - key: MEMBERSENSE_DATABASE_URL
        fromDatabase:
          name: membersense-db
          property: connectionString
      - key: MEMBERSENSE_GYM_NAME
        value: "Anytime Fitness High Wycombe"
      - key: MEMBERSENSE_DRY_RUN
        value: "1"
      # Start with 0; switch to 1 only after a successful live-database preview.
      - key: MEMBERSENSE_CLUBWISE_ENABLED
        sync: false
      - key: MEMBERSENSE_CLUBWISE_USERNAME
        sync: false
      - key: MEMBERSENSE_CLUBWISE_PASSWORD
        sync: false

databases:
  - name: membersense-db
    plan: basic-256mb
    region: oregon
